<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">V Vishak — AI Engineer · Python Developer · AI / ML</title>
  <desc id="d">An AI Engineer's journey. Building intelligence. Creating what's next. Building practical AI systems with Python, machine learning and computer vision, one working project at a time. Now building PrepPitch with Django / Python.</desc>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10%, 90% { opacity: .9; } 100% { transform: translateY(236px); opacity: 0; } }
    @keyframes caret { 50% { opacity: 0; } }
    .scan { animation: scan 4.5s ease-in-out infinite; }
    .caret { animation: caret 1s steps(1) infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx=".78" cy=".5" r=".45">
      <stop offset="0" stop-color="#D7263D" stop-opacity=".14"/><stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E" stop-opacity="0"/><stop offset=".5" stop-color="#FF4D5E"/><stop offset="1" stop-color="#FF4D5E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="459" rx="18" fill="none" stroke="#26100F"/>
  <rect width="1200" height="460" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="18" fill="url(#glow)"/>
  
