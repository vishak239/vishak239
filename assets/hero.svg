  <text x="76" y="184" class="serif" font-size="84" font-weight="400" letter-spacing="6" fill="#F7F2F2">V Vishak</text>
  <text x="80" y="226" class="mono" font-size="15" font-weight="600" letter-spacing="4.5" fill="#D7263D">AI ENGINEER / PYTHON DEVELOPER / AI / ML</text>
