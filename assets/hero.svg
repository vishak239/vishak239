  <text x="80" y="292" class="serif" font-size="25" font-style="italic" fill="#FF4D5E">“Building intelligence. Creating what’s next.”</text>
  <text x="80" y="332" class="sans" font-size="17" fill="#ABA3A3">Building practical AI systems with Python, machine learning</text>
  <text x="80" y="356" class="sans" font-size="17" fill="#ABA3A3">and computer vision, one working project at a time.</text>

