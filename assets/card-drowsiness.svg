<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="t d">
  <title id="t">Driver Drowsiness Detection — NOT YET PUBLIC</title>
  <desc id="d">Watching for closed eyes, frame by frame Webcam-based drowsiness detection built with OpenCV, using the Eye Aspect Ratio (EAR) together with a CNN-based approach. Stack: Python · OpenCV · EAR · CNN.</desc>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="600" height="270" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="599" height="269" rx="16" fill="none" stroke="#26100F"/>
  <rect x="32" y="0" width="56" height="2" fill="#D7263D"/>
  <g transform="translate(32 30) scale(1)" fill="none" stroke="#FF4D5E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5"/></g>
  <text x="66" y="47" class="mono" font-size="11.5" letter-spacing="2.5" fill="#D7263D">COMPUTER VISION</text>
  <g>
    <rect x="432.6" y="31" width="135.39999999999998" height="22" rx="11" fill="none" fill-opacity="0" stroke="#D7263D" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <text x="500.3" y="46" class="mono" font-size="11" letter-spacing="1.5" fill="#FF4D5E" text-anchor="middle" font-weight="600">NOT YET PUBLIC</text>
  </g>
  <text x="32" y="104" class="serif" font-size="30" fill="#F7F2F2">Driver Drowsiness Detection</text>
  <text x="32" y="130" class="mono" font-size="11" letter-spacing="1.8" fill="#FF4D5E">WATCHING FOR CLOSED EYES, FRAME BY FRAME</text>
  <text x="32" y="160" class="sans" font-size="16" fill="#ABA3A3">Webcam-based drowsiness detection built with OpenCV, using the</text>
  <text x="32" y="183" class="sans" font-size="16" fill="#ABA3A3">Eye Aspect Ratio (EAR) together with a CNN-based approach.</text>
  <rect x="32" y="218" width="536" height="1" fill="#3A1517"/>
  <text x="32" y="246" class="mono" font-size="12.5" letter-spacing=".5" fill="#FF4D5E">Python · OpenCV · EAR · CNN</text>
  <text x="568" y="246" class="mono" font-size="11" letter-spacing="1.5" fill="#6E6566" text-anchor="end">PRIVATE FOR NOW</text>
</svg>
