<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">Let's build something intelligent</title>
  <desc id="d">Reach V Vishak at vishak3416@gmail.com or linkedin.com/in/vishak3416</desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes grow { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
    .grow { transform-origin: 600px 0; animation: grow 6s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E6C45A"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6C45A"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C9A227" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="199" rx="18" fill="none" stroke="#1F1B10"/>
  <rect width="1200" height="200" rx="18" fill="url(#grid)"/>
  
  <g stroke="#C9A227" stroke-opacity=".55" stroke-width="1.2" fill="none">
    <path d="M22 38V22H38"/><path d="M1162 22H1178V38"/>
    <path d="M22 162V178H38"/><path d="M1162 178H1178V162"/>
  </g>
  <rect class="grow" x="420" y="142" width="360" height="1.2" fill="url(#rule)"/>
  <text x="600" y="78" class="mono" font-size="12" letter-spacing="4" fill="#C9A227" text-anchor="middle">OPEN TO CONVERSATIONS ON AI · ML · PYTHON</text>
