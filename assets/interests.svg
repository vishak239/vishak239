<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="136" viewBox="0 0 1200 136" role="img" aria-labelledby="t d">
  <title id="t">Interests</title>
  <desc id="d">Artificial intelligence, Machine learning, Python development, Backend development, Computer vision, Data science, Automotive AI, Intelligent applications</desc>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="136" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="135" rx="16" fill="none" stroke="#26100F"/>
  <text x="44" y="30" class="mono" font-size="11" letter-spacing="2.5" fill="#D7263D">INTERESTS</text>
  <rect x="44" y="40" width="218.6" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="153.3" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Artificial intelligence</text><rect x="272.6" y="40" width="161.2" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="353.20000000000005" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Machine learning</text><rect x="443.8" y="40" width="177.6" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="532.6" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Python development</text><rect x="631.4" y="40" width="185.79999999999998" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="724.3" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Backend development</text><rect x="827.1999999999999" y="40" width="153" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="903.6999999999999" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Computer vision</text><rect x="990.1999999999999" y="40" width="128.39999999999998" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
  <text x="1054.3999999999999" y="61" class="sans" font-size="14.5" fill="#F7F2F2" text-anchor="middle">Data science</text><rect x="44" y="84" width="136.6" height="32" rx="16" fill="#100C0D" stroke="#D7263D" stroke-opacity=".3"/>
