<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">An AI Engineer's Journey</title>
  <desc id="d">Stage 1, Python Foundations: Exercises, classes, Tkinter GUIs and MySQL scripts. Stage 2, Machine Learning: Regression with scikit-learn, NumPy, pandas and plots. Stage 3, Deep Learning: Neural-network fundamentals, now learning. Stage 4, Computer Vision: OpenCV drowsiness detection with EAR and a CNN. Stage 5, NLP: Exploring tokens, embeddings and similarity. Stage 6, Generative AI &amp; Apps: Gemini in PrepPitch; Django app in development. Stage 7, Production AI Engineering: Next: server APIs, data pipelines, deployed models</desc>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="16" fill="url(#bg)"/>
