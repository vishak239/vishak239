<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">V Vishak monogram</title>
  <desc id="d"></desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="460" height="460" fill="url(#bg)"/>
  <rect width="460" height="460" fill="url(#grid)"/>
  <circle cx="230" cy="230" r="170" fill="#D7263D" fill-opacity=".08"/>
  
  <g stroke="#D7263D" stroke-opacity=".55" stroke-width="1.2" fill="none">
    <path d="M70 104V70H104"/><path d="M356 70H390V104"/>
    <path d="M70 356V390H104"/><path d="M356 390H390V356"/>
  </g>
  <path d="M150 150 L230 318 L310 150" fill="none" stroke="#D7263D" stroke-width="30" stroke-linejoin="miter" stroke-linecap="square"/>
  <path d="M196 150 L230 222 L264 150" fill="none" stroke="#F7F2F2" stroke-width="10" stroke-linecap="square" opacity=".9"/>
  <text x="230" y="378" class="mono" font-size="16" letter-spacing="8" fill="#ABA3A3" text-anchor="middle">VISHAK</text>
</svg>
