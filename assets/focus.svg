    <text x="22" y="114" class="sans" font-size="14.5" fill="#ABA3A3">Main app in Django / Python:</text><text x="22" y="135" class="sans" font-size="14.5" fill="#ABA3A3">interview flow, evaluation,</text><text x="22" y="156" class="sans" font-size="14.5" fill="#ABA3A3">speech-to-text, adaptive</text><text x="22" y="177" class="sans" font-size="14.5" fill="#ABA3A3">interviews</text>
