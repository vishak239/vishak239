    <rect x="20" y="0" width="36" height="2" fill="#D7263D"/>
    <text x="20" y="32" class="mono" font-size="11" letter-spacing="2.5" fill="#D7263D">UNIVERSITY</text>
    <text x="20" y="62" class="serif" font-size="21" fill="#F7F2F2">B.Tech Artificial Intelligence &amp; Data Science</text>
    <text x="20" y="86" class="sans" font-size="13.5" fill="#ABA3A3">Loyola Institute of Technology and Science · Final year · CGPA 8.5 / 10 · 2027</text>
