<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d">
  <title id="t">PrepPitch — interview-practice platform</title>
  <desc id="d">Public prototype (React, TypeScript, Vite, Tailwind CSS, Gemini API, Web Speech API) with built stages: Interview setup, Question engine, Mock interview, Answers, Follow-up, Evaluation, Progress. Main application in Django/Python, in development and not yet public: Django / Python backend, Interview flow, Question engine, Answer evaluation, Speech-to-text, Adaptive interviews.</desc>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes sweep { 0% { transform: translateX(-520px); } 60%, 100% { transform: translateX(520px); } }
    .shine { animation: sweep 5s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7263D" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7263D" stop-opacity="0"/><stop offset=".5" stop-color="#D7263D" stop-opacity=".1"/><stop offset="1" stop-color="#D7263D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="row"><rect width="500" height="44" rx="10"/></clipPath>
    <clipPath id="clip"><rect width="1200" height="610" rx="16"/></clipPath>
  </defs>

