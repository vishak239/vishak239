  <text x="84" y="62" class="mono" font-size="12" letter-spacing="3" fill="#D7263D">FEATURED PROJECT</text>
  <text x="42" y="118" class="serif" font-size="48" fill="#F7F2F2">PrepPitch</text>
  <text x="300" y="92" class="serif" font-size="15" font-style="italic" letter-spacing="1" fill="#FF4D5E">Practice until your pitch is perfect.</text>
  <text x="300" y="116" class="sans" font-size="16" fill="#ABA3A3">A mock-interview practice app for students that I own and develop:</text>
  <text x="300" y="138" class="sans" font-size="16" fill="#ABA3A3">set up a role, answer timed questions, get structured feedback.</text>
  <rect x="42" y="156" width="1116" height="1" fill="#3A1517"/>

