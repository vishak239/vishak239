<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d">
  <title id="t">PrepPitch — interview-practice platform</title>
  <desc id="d">Public prototype (React, TypeScript, Vite, Tailwind CSS, Gemini API) with built stages: Interview setup, Question engine, Mock interview, Answers, Follow-up, Evaluation, Progress. Main application in Django/Python, in development and not yet public: Backend, Interview flow, Question engine, Answer evaluation, Speech-to-text, Adaptive interviews.</desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes sweep { 0% { transform: translateX(-520px); } 60%, 100% { transform: translateX(520px); } }
    .shine { animation: sweep 5s ease-in-out infinite; }
  </style>
